<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="GitHub stars across all 36 repositories, June to August 2026: a flat line at zero with a single star on June 19. Annotated as the starting line.">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E06B3A" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#E06B3A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="560" rx="16" fill="#0C0C0E"/>
  <rect width="1200" height="560" rx="16" fill="none" stroke="#26262B" stroke-width="1"/>

  <text x="64" y="76" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="28" font-weight="600" fill="#F5F5F4">GitHub stars, entire account · 36 repositories</text>
  <text x="64" y="108" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" fill="#8A8A93">June – August 2026 · self-stars excluded</text>

  <!-- plot area: x 64..1136, y 160..440 -->
  <!-- gridlines -->
  <g stroke="#1D1D22" stroke-width="1">
    <line x1="64" y1="160" x2="1136" y2="160"/>
    <line x1="64" y1="300" x2="1136" y2="300"/>
    <line x1="64" y1="440" x2="1136" y2="440"/>
  </g>
  <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#5C5C66">
    <text x="40" y="165" text-anchor="end">2</text>
    <text x="40" y="305" text-anchor="end">1</text>
    <text x="40" y="445" text-anchor="end">0</text>
  </g>

  <!-- area under line -->
  <path d="M 64 440 L 304 440 L 310 300 L 1136 300 L 1136 440 Z" fill="url(#fade)"/>
  <!-- the line: zero until June 19, then one star, flat since -->
  <path d="M 64 440 L 304 440 L 310 300 L 1136 300" fill="none" stroke="#E06B3A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- the one star -->
  <circle cx="310" cy="300" r="7" fill="#0C0C0E" stroke="#E06B3A" stroke-width="3"/>
  <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
    <text x="328" y="252" font-size="16" font-weight="600" fill="#F5F5F4">June 19 — a stranger in Pennsylvania</text>
    <text x="328" y="276" font-size="15" fill="#8A8A93">finds Loki. Total audience: 1.</text>
  </g>

  <!-- x axis labels -->
  <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#5C5C66">
    <text x="64" y="472">Jun</text>
    <text x="580" y="472" text-anchor="middle">Jul</text>
    <text x="1136" y="472" text-anchor="end">Aug 22</text>
  </g>

  <!-- caption -->
  <line x1="64" y1="500" x2="1136" y2="500" stroke="#1D1D22" stroke-width="1"/>
  <text x="64" y="530" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" fill="#B9B9C0">This is the starting line. Everything after this chart is the experiment.</text>
</svg>
